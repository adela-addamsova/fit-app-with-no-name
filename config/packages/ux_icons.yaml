# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:

    # Default HTML attributes to add to all icons
    default_icon_attributes:

        # Use current text color to fill the icon
        fill: currentColor

        # Default dimensions
        height: '1em'
        width: '1em'

    # Throw an exception if an icon is not
    ignore_not_found: false

    # App icon names used in templates => actual icon (browse at ux.symfony.com/icons).
    # Dev fetches new icons automatically; before deploying, run
    # php bin/console ux:icons:lock to store all of them in assets/icons/.
    aliases:
        dashboard: 'lucide:house'
        weight: 'lucide:weight'
        workouts: 'lucide:dumbbell'
        food: 'ep:food'
        settings: 'lucide:settings'
        add: 'lucide:plus'
        close: 'lucide:x'
        previous: 'lucide:chevron-left'
        next: 'lucide:chevron-right'
        trend-down: 'lucide:arrow-down'
        trend-up: 'lucide:arrow-up'
        theme-system: 'lucide:monitor'
        theme-light: 'lucide:sun'
        theme-dark: 'lucide:moon'

when@prod:
    ux_icons:
        # Suppress exceptions for missing icons in production
        ignore_not_found: true
